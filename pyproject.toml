[project]
name = "sharpa-hand-demo"
version = "0.1.0"
description = "Python tools of the Sharpa hand card-shuffle demos: the IK motion generator, the collider bake and the clip renderer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "warp-lang>=1.16.0",
    "newton>=1.5.1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
    "matplotlib>=3.8",
    "scikit-image>=0.22",
    "pyglet>=2.0",
    "PyOpenGL>=3.1",
    "trimesh>=4",
]

[tool.uv]
# a collection of scripts (tool/ik, tool/bake_hand_shuffle.py, tool/render_hand_shuffle.py), not an installable package
package = false
